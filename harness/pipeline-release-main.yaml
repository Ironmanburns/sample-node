# Release on push to main — creates v* tag only (no stable deploy).
pipeline:
  name: Release sample-node Main
  identifier: Release_sample_node_Main
  projectIdentifier: sample_apps
  orgIdentifier: default
  tags:
    app: sample-node
    release: semver-main
  properties:
    ci:
      codebase:
        connectorRef: github_sample_apps
        repoName: Ironmanburns/sample-node
        build: <+input>
        depth: 0
  stages:
    - stage:
        name: Release
        identifier: Release
        description: Conventional commits → annotated v* tag (+ optional GH Release)
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: local_kind_k8s
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Semver tag release
                  identifier: Semver_tag_release
                  spec:
                    connectorRef: dockerhub_public
                    image: alpine:3.20
                    shell: Sh
                    envVariables:
                      GITHUB_TOKEN: <+secrets.getValue("github_release_token")>
                      GITHUB_REPOSITORY: Ironmanburns/sample-node
                      RELEASE_BRANCH: main
                      CREATE_GITHUB_RELEASE: "true"
                    command: |-
                      set -e
                      apk add --no-cache git bash python3 nodejs curl >/dev/null
                      echo "codebase.branch=<+codebase.branch> trigger.branch=<+trigger.branch>"
                      BRANCH="<+codebase.branch>"
                      TB="<+trigger.branch>"
                      if [ -z "$BRANCH" ] || [ "$BRANCH" = "null" ]; then BRANCH="$TB"; fi
                      if [ "$BRANCH" != "main" ]; then
                        echo "Release pipeline only runs for main (got branch=${BRANCH} trigger=${TB})"
                        exit 1
                      fi
                      if [ -z "$GITHUB_TOKEN" ]; then
                        echo "GITHUB_TOKEN / secret github_release_token is empty"
                        exit 1
                      fi
                      echo "token_present=yes"
                      echo "token_len=$(printf %s "$GITHUB_TOKEN" | wc -c)"
                      git config --global --add safe.directory /harness
                      cd /harness
                      chmod +x scripts/harness-semver-release.sh
                      bash scripts/harness-semver-release.sh
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
