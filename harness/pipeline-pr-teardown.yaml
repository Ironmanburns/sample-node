# PR teardown — delete ephemeral preview when PR closes/merges.
pipeline:
  name: PR Teardown sample-node
  identifier: PR_Teardown_sample_node
  projectIdentifier: default_project
  orgIdentifier: default
  tags:
    app: sample-node
    deploy: pr-teardown
  stages:
    - stage:
        name: Teardown
        identifier: Teardown
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  type: ShellScript
                  name: Delete preview namespace
                  identifier: Delete_preview_ns
                  timeout: 5m
                  spec:
                    shell: Bash
                    source:
                      type: Inline
                      spec:
                        script: |-
                          set -e
                          NS="samples-pr-sample-node-<+trigger.prNumber>"
                          echo "Deleting namespace ${NS} (if present)"
                          kubectl delete namespace "${NS}" --ignore-not-found
                    onDelegate: true
                    delegateSelectors:
                      - local-kind
